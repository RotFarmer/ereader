name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace :app:testReleaseUnitTest :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk E-Reader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: E-Reader-apk
          path: E-Reader.apk

      # A fixed "latest" release, so the newest APK is always at the same link:
      # https://github.com/<owner>/<repo>/releases/download/latest/E-Reader.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          git push origin :refs/tags/latest || true
          gh release create latest E-Reader.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "E-Reader build ${{ github.run_number }}" \
            --notes "$(printf 'versionCode: %s\n\n%s\n\nBuilt from %s (%s). Download E-Reader.apk on your tablet and open it to install, or use Check for updates in the app. New builds install over old ones and keep your books and notes.' "${{ github.run_number }}" "$(git log -1 --pretty=%s)" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}")"
